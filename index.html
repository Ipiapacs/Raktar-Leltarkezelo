<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raktárkezelő</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Bal oldali Navigációs Sáv (Sidebar) -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar offcanvas-md offcanvas-start p-3" tabindex="-1"
                id="sidebarMenu">
                <div class="offcanvas-header px-0 pb-3 d-md-none">
                    <h5 class="offcanvas-title text-white" id="sidebarMenuLabel">Intelligens Raktár</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        data-bs-target="#sidebarMenu" aria-label="Close"></button>
                </div>
                <div class="d-flex align-items-center mb-4 px-2 d-none d-md-flex">
                    <i class="bi bi-box-seam text-primary fs-4 me-2"></i>
                    <span class="fs-5 fw-bold text-white">Intelligens Raktár</span>
                </div>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" onclick="ui.switchTab('dashboard', event)">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="ui.switchTab('keszlet', event)">
                            <i class="bi bi-boxes me-2"></i> Készlet
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="ui.switchTab('leltar', event)">
                            <i class="bi bi-clipboard-check me-2"></i> Leltár
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="ui.switchTab('statisztikak', event)">
                            <i class="bi bi-bar-chart-line me-2"></i> Statisztikák
                        </a>
                    </li>
                </ul>
                <hr class="border-secondary">
                <div class="px-2">
                    <button class="btn btn-outline-light btn-sm w-100" data-bs-toggle="modal"
                        data-bs-target="#helyszinekModal">
                        <i class="bi bi-geo-alt me-1"></i> Helyszínek
                    </button>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

                <div class="d-md-none mb-3">
                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                        <i class="bi bi-list me-1"></i> Menü
                    </button>
                </div>

                <!-- 1. TAB: DASHBOARD -->
                <div id="tab-dashboard" class="content-tab">
                    <!-- Dashboard tartalma -->
                </div>

                <!-- 2. TAB: KÉSZLET -->
                <div id="tab-keszlet" class="content-tab d-none">
                    <!-- Készlet tartalma -->

                </div>

                <!-- 3. TAB: LELTÁR -->
                <div id="tab-leltar" class="content-tab d-none">
                    <!-- Leltár tartalma -->
                </div>

                <!-- 4. TAB: STATISZTIKÁK -->
                <div id="tab-statisztikak" class="content-tab d-none">
                    <!-- Statisztikák tartalma -->
                </div>
            </main>
        </div>
    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Különálló JS osztályok -->
    <script src="js/RaktarVezerlo.js"></script>
    <script src="js/UIVezerlo.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
